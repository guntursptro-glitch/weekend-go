<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Tempat - Weekend Go</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <a href="search.html" class="back-link">Kembali ke hasil</a>

    <div class="slider">
      <div class="slider-track" id="slider-track"></div>
      <button type="button" class="slider-btn prev" id="slider-prev" aria-label="Foto sebelumnya">&lsaquo;</button>
      <button type="button" class="slider-btn next" id="slider-next" aria-label="Foto berikutnya">&rsaquo;</button>
      <span class="slider-count" id="slider-count">1 / 3</span>
    </div>

    <h1 id="place-name">Nama tempat</h1>
    <p class="place-meta" id="place-meta">Area · jenis masakan</p>
    <p class="place-price" id="place-price">Rp0 - Rp0 <small>per orang</small></p>

    <div class="info-card">
      <div class="info-row">
        <span class="info-label">Alamat</span>
        <span id="place-address">Alamat tempat</span>
      </div>
      <div class="info-row">
        <span class="info-label">Jam buka</span>
        <span id="place-hours">Jam buka</span>
      </div>
      <div class="info-row">
        <span class="info-label">Fasilitas</span>
        <span id="place-facilities">Fasilitas</span>
      </div>
      <div class="info-row">
        <span class="info-label">Reservasi</span>
        <span id="place-phone">Nomor WhatsApp / telepon</span>
      </div>
      <div class="info-row">
        <span class="info-label">Media sosial</span>
        <span id="place-social">Instagram · TikTok</span>
      </div>
    </div>

    <p class="info-note">Harga terakhir dicek: <span id="price-checked">-</span></p>

    <div class="action-bar">
      <a href="#" id="maps-link" class="btn btn-outline" target="_blank" rel="noopener">Buka Maps</a>
      <a href="#" id="wa-link" class="btn btn-primary" target="_blank" rel="noopener">Reservasi WA</a>
    </div>
  </main>
    <div class="lightbox" id="lightbox" hidden>
    <button type="button" class="lightbox-close" id="lightbox-close" aria-label="Tutup">&times;</button>
    <button type="button" class="lightbox-nav prev" id="lightbox-prev" aria-label="Foto sebelumnya">&lsaquo;</button>
    <img id="lightbox-img" src="" alt="">
    <button type="button" class="lightbox-nav next" id="lightbox-next" aria-label="Foto berikutnya">&rsaquo;</button>
    <span class="lightbox-count" id="lightbox-count"></span>
  </div>
    <script src="js/data.js"></script>
    <script src="js/detail.js"></script>
</body>
</html>
